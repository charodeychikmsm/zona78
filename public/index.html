<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ZONA78</title>
<style>

  #menu .subtitle { color: #666; font-size: 13px; letter-spacing: 5px; margin-bottom: 35px; text-transform: uppercase; }
  .btn { padding: 16px 40px; font-size: 16px; font-family: 'Courier New', monospace;
    font-weight: bold; letter-spacing: 3px; border: 2px solid #ffaa44; border-radius: 4px;

    transition: all 0.2s; text-transform: uppercase; margin: 8px; min-width: 280px; }
  .btn:hover { background: #ffaa44; color: #1a1a1d; box-shadow: 0 0 30px rgba(255,170,68,0.6); }
  .btn.ghost { border-color: #444; color: #888; }
  .btn.ghost:hover { background: #333; color: #ccc; box-shadow: none; }
  .input { padding: 14px 20px; font-size: 22px; letter-spacing: 8px; text-align: center;

    color: #fff; outline: none; width: 260px; text-transform: uppercase; }
  .input:focus { border-color: #ffaa44; }
  #colors { display: flex; gap: 10px; margin: 15px 0 25px 0; justify-content: center; }
  .color-btn { width: 38px; height: 38px; border: 2px solid transparent;
    border-radius: 4px; cursor: pointer; transition: all 0.2s; }
  .color-btn.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 20px currentColor; }

  #hud .info { color: #ccc; font-size: 13px; letter-spacing: 2px; text-align: right; line-height: 1.7; }
  #hud .room-code { color: #ffaa44; font-weight: bold; letter-spacing: 4px; }
  #hud .deaths { color: #ef4444; font-weight: bold; }
  #hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #ffaa44; font-size: 15px; letter-spacing: 2px; text-align: center;
    background: rgba(0,0,0,0.85); padding: 12px 24px; border-radius: 4px;
    border: 1px solid rgba(255,170,68,0.3); z-index: 10; pointer-events: none;

  #status { position: fixed; bottom: 15px; right: 15px; color: #4ade80; font-size: 12px; z-index: 10; }
  #status.bad { color: #f87171; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">

<div id="hint" class="hidden"></div>

let audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
window.addEventListener('keydown', initAudio);
window.addEventListener('click', initAudio);

function playTone(f1, f2, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
function playNoise(dur, vol, freq) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const n = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 500;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol || 0.03, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t); src.stop(t + dur + 0.02);
  } catch(e){}
}
function sfxStep()  { playNoise(0.05, 0.025, 350); }
function sfxJump()  { playTone(280, 480, 0.09, 'sine', 0.04); }
function sfxLand()  { playTone(130, 50, 0.12, 'triangle', 0.06); }
function sfxPlate() { playTone(600, 900, 0.12, 'sine', 0.07); }
function sfxFail()  { playTone(220, 110, 0.22, 'sawtooth', 0.05); }
function sfxKey()   { playTone(800, 1500, 0.18, 'sine', 0.06); }
function sfxLever() { playTone(160, 80, 0.16, 'square', 0.055); }
function sfxWin()   { [523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,f*1.02,0.22,'sine',0.07)}, i*110);}); }
function sfxGolden(){ [800,1000,1200,1500].forEach(function(f,i){setTimeout(function(){playTone(f,f*1.1,0.15,'sine',0.05)}, i*60);}); }
function sfxDeath() {
  playTone(300, 60, 0.35, 'sawtooth', 0.1);
  playNoise(0.2, 0.08, 200);
  setTimeout(function() { playTone(150, 40, 0.4, 'triangle', 0.08); }, 100);
}

function getTime() { return performance.now() / 1000; }

// ==================== ПЛАТФОРМЫ: ПОЗИЦИИ ====================
function getMovingPos(p) {
  const t = getTime();
  const dx = p.axis === 'x' ? Math.sin(t * p.speed + (p.phase || 0)) * p.range : 0;
  const dy = p.axis === 'y' ? Math.sin(t * p.speed + (p.phase || 0)) * p.range : 0;
  return { x: p.x + dx, y: p.y + dy, w: p.w, h: p.h, moving: true };
}
function isVanishActive(p) {
  const t = getTime();
  const cycle = p.onTime + p.offTime;
  const phase = ((t + (p.phase || 0)) % cycle + cycle) % cycle;
  return phase < p.onTime;
}
function isLaserActive(l) {
  const t = getTime();
  const phase = ((t + (l.phase || 0)) % l.period + l.period) % l.period;
  return (phase / l.period) < l.dutyCycle;
}

// ==================== ФИЗИКА ====================
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updatePhysics(dt) {
  const lvl = LEVELS[levelNum]; if (!lvl) return;

  let dx = 0;
  if (keys['a'] || keys['ф'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['в'] || keys['arrowright']) dx += 1;
  if (dx) me.facing = dx;
  me.vx = dx * MOVE_SPEED;

  // Прыжок
  if ((keys['w'] || keys['ц'] || keys['arrowup'] || keys[' ']) && me.onGround) {
    const onFriend = other.online &&
      Math.abs(me.y + PLAYER_H - other.y) < 15 &&
      me.x + PLAYER_W > other.x &&
      me.x < other.x + PLAYER_W;
    me.vy = onFriend ? -JUMP_FORCE * 1.35 : -JUMP_FORCE;
    me.onGround = false;
    sfxJump();
    if (onFriend) spawnDust(me.x + PLAYER_W/2, me.y + PLAYER_H, 10);
  }

  me.vy += GRAVITY * dt;
  if (me.vy > 1200) me.vy = 1200;

  // Список платформ: статичные + движущиеся + мигающие + друг
  const plats = lvl.platforms.slice();
  if (lvl.movingPlats) for (const mp of lvl.movingPlats) plats.push(getMovingPos(mp));
  if (lvl.vanishPlats) for (const vp of lvl.vanishPlats) {
    if (isVanishActive(vp)) plats.push({ x:vp.x, y:vp.y, w:vp.w, h:vp.h, vanish:true, platRef:vp });
  }
  if (other.online) {
    const nearTop = me.y + PLAYER_H <= other.y + 20 && me.y + PLAYER_H >= other.y - 5;
    const horiz = me.x + PLAYER_W > other.x + 4 && me.x < other.x + PLAYER_W - 4;
    if (nearTop && horiz && me.vy >= 0) {
      plats.push({ x:other.x, y:other.y, w:PLAYER_W, h:PLAYER_H });
    }
  }

  // Горизонталь
  me.x += me.vx * dt;
  for (const p of plats) {
    const r = { x:me.x, y:me.y, w:PLAYER_W, h:PLAYER_H };
    if (overlap(r, p)) {
      if (me.vx > 0) me.x = p.x - PLAYER_W;
      else if (me.vx < 0) me.x = p.x + p.w;
    }
  }

  // Вертикаль
  me.wasOnGround = me.onGround;
  me.onGround = false;
  me.y += me.vy * dt;
  for (const p of plats) {
    const r = { x:me.x, y:me.y, w:PLAYER_W, h:PLAYER_H };
    if (overlap(r, p)) {
      if (me.vy > 0) { me.y = p.y - PLAYER_H; me.vy = 0; me.onGround = true; }
      else if (me.vy < 0) { me.y = p.y + p.h; me.vy = 0; }
      else if (p.moving) { me.y = p.y - PLAYER_H; me.onGround = true; }
    }
  }

  if (!me.wasOnGround && me.onGround) {
    sfxLand(); spawnDust(me.x + PLAYER_W/2, me.y + PLAYER_H, 6);
  }

  if (me.x < 20) me.x = 20;
  if (me.x + PLAYER_W > 980) me.x = 980 - PLAYER_W;
  if (me.y > 700) {
    killPlayer();
    return;
  }

  if (Math.abs(me.vx) > 10 && me.onGround) {
    me.walkPhase += dt * 10;
    footstepCd -= dt;
    if (footstepCd <= 0) { sfxStep(); footstepCd = 0.32; }
  }

  // ============ ЛОВУШКИ ============
  const myRect = { x:me.x + 3, y:me.y + 3, w:PLAYER_W - 6, h:PLAYER_H - 3 };

  // Шипы
  if (lvl.spikes) for (const s of lvl.spikes) {
    if (overlap(myRect, s)) { killPlayer(); return; }
  }

  // Лазеры
  if (lvl.lasers) for (const l of lvl.lasers) {
    if (!isLaserActive(l)) continue;
    const laserRect = { x:l.x - l.w/2, y:l.y, w:l.w + 4, h:l.h };
    if (overlap(myRect, laserRect)) { killPlayer(); return; }
  }

  // ============ ВЗАИМОДЕЙСТВИЯ ============
  if (lvl.key && !puzzle.keyCollected) {
    const kr = { x:lvl.key.x, y:lvl.key.y, w:lvl.key.w, h:lvl.key.h };
    const mr = { x:me.x, y:me.y, w:PLAYER_W, h:PLAYER_H };
    if (overlap(mr, kr)) { sfxKey(); sendEvent('key'); }
  }

  if (lvl.plates) {
    lvl.plates.forEach(function(plate, i) {
      const cx = me.x + PLAYER_W / 2;
      const on = me.onGround && cx > plate.x && cx < plate.x + plate.w && Math.abs(me.y + PLAYER_H - plate.y) < 25;
      if (on && !atPlate[i]) {
        atPlate[i] = true;
        if (i === puzzle.plateSequence[puzzle.nextPlateIdx]) sfxPlate(); else sfxFail();
        sendEvent('plate', { index: i });
      } else if (!on && atPlate[i]) atPlate[i] = false;
    });
  }

  if (lvl.syncLevers) {
    lvl.syncLevers.forEach(function(lever, i) {
      const lr = { x:lever.x, y:lever.y, w:lever.w, h:lever.h };
      const mr = { x:me.x, y:me.y, w:PLAYER_W, h:PLAYER_H };
      const on = overlap(mr, lr);
      if (on && !atSyncLever[i]) { atSyncLever[i] = true; sfxLever(); sendEvent('sync', { which:i }); }
      else if (!on && atSyncLever[i]) atSyncLever[i] = false;
    });
  }

  if (lvl.lever && !puzzle.leverPulled) {
    const lr = { x:lvl.lever.x, y:lvl.lever.y, w:lvl.lever.w, h:lvl.lever.h };
    const mr = { x:me.x, y:me.y, w:PLAYER_W, h:PLAYER_H };
    if (overlap(mr, lr)) { sfxLever(); sendEvent('lever'); }
  }

  if (lvl.door && puzzle.doorOpen) {
    const dr = { x:lvl.door.x, y:lvl.door.y, w:lvl.door.w, h:lvl.door.h };
    const mr = { x:me.x, y:me.y, w:PLAYER_W, h:PLAYER_H };
    const inside = overlap(mr, dr);
    if (inside !== atDoor.me) { atDoor.me = inside; sendEvent('door', { value:inside }); }
  }
}

// ==================== СЕТЬ ====================
let sendTimer = 0;
function sendState(dt) {
  sendTimer -= dt; if (sendTimer > 0) return;
  sendTimer = 1/30;
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type:'state', data:{ x:me.x, y:me.y, facing:me.facing, walkPhase:me.walkPhase }}));
}
function sendEvent(event, data) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type:'event', event, ...(data||{}) }));
}
function connectServer() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = function() { setStatus('🟢 подключено', false); };
  ws.onclose = function() { setStatus('🔴 отключено', true); setTimeout(connectServer, 2000); };
  ws.onerror = function() { setStatus('⚠ ошибка', true); };
  ws.onmessage = function(e) { try { handleMessage(JSON.parse(e.data)); } catch(err){} };
}
function handleMessage(msg) {
  if (msg.type === 'created') {
    myId = msg.playerId; roomCode = msg.code;
    document.getElementById('wait-code').textContent = msg.code;
    document.getElementById('hud-code').textContent = msg.code;
    showScreen('wait');
  } else if (msg.type === 'joined') {
    myId = msg.playerId; roomCode = msg.code;
    other.online = true; other.color = msg.otherColor;
    if (msg.puzzle) puzzle = msg.puzzle;
    document.getElementById('hud-code').textContent = msg.code;
    startGame(msg.level);
  } else if (msg.type === 'playerJoined') {
    other.online = true; other.color = msg.color;
    if (msg.puzzle) puzzle = msg.puzzle;
    startGame(1);
  } else if (msg.type === 'state') {
    if (!otherInitialized) {
      other.x = other.targetX = msg.data.x;
      other.y = other.targetY = msg.data.y;
      otherInitialized = true;
    }
    other.targetX = msg.data.x; other.targetY = msg.data.y;
    other.facing = msg.data.facing; other.walkPhase = msg.data.walkPhase;
  } else if (msg.type === 'puzzle') {
    puzzle = msg.state;
  } else if (msg.type === 'death') {
    if (msg.puzzle) puzzle = msg.puzzle;
    sfxDeath();
    deathFlash = 1;
    screenShake = 20;
    respawnAll();
  } else if (msg.type === 'level') {
    if (msg.puzzle) puzzle = msg.puzzle;
    if (msg.level > LEVEL_COUNT) {
      sfxWin();
      const wt = document.getElementById('win-time');
      const wd = document.getElementById('win-deaths');
      if (wt) wt.textContent = Math.floor(performance.now() / 1000) + ' сек';
      if (wd) wd.textContent = deathsCount;
      document.getElementById('menu-win').classList.remove('hidden');
      document.getElementById('menu').classList.remove('hidden');
      document.getElementById('hud').classList.add('hidden');
      gameRunning = false;
    } else {
      loadLevel(msg.level);
    }
  } else if (msg.type === 'playerLeft') {
    other.online = false; otherInitialized = false;
    showHint('⚠ Игрок отключился');
  } else if (msg.type === 'error') {
    alert(msg.message); showScreen('main');
  }
}
function setStatus(t, bad) {
  const el = document.getElementById('status');
  el.textContent = t; el.classList.toggle('bad', bad);
}
function ensureConnected(cb) {
  if (ws && ws.readyState === 1) { cb(); return; }
  if (!ws) connectServer();
  const h = function() { ws.removeEventListener('open', h); cb(); };
  ws.addEventListener('open', h);
}
function interpOther() {
  if (!other.online) return;
  other.x += (other.targetX - other.x) * 0.3;
  other.y += (other.targetY - other.y) * 0.3;
  if (Math.abs(other.targetX - other.x) > 2) other.walkPhase += 0.3;
}

// ==================== ЧАСТИЦЫ ====================
const particles = [];
function spawnDust(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random()-0.5) * 140, vy: Math.random() * -50 - 10,
      size: Math.random() * 2 + 2, color: '#888',
      life: 1, decay: 0.028
    });
  }
}
function spawnAmbient() {
  particles.push({
    x: Math.random() * ROOM_W, y: ROOM_H + 5,
    vx: (Math.random()-0.5) * 30, vy: Math.random() * -15 - 10,
    size: Math.random() * 1.5 + 1, color: 'rgba(255,190,120,0.6)',
    life: 1, decay: 0.0035, ambient: true
  });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (!p.ambient) { p.vx *= 0.96; p.vy *= 0.96; }
    p.life -= p.decay;
    if (p.life <= 0 || p.y < -20) particles.splice(i, 1);
  }
  if (Math.random() < 0.35) spawnAmbient();
}

// ==================== ОТРИСОВКА ====================
function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, ROOM_W, ROOM_H); ctx.clip();

  // Тряска
  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShake;
    const sy = (Math.random() - 0.5) * screenShake;
    ctx.translate(sx, sy);
  }

  const lvl = LEVELS[levelNum];
  if (lvl) {
    ctx.fillStyle = lvl.bg;
    ctx.fillRect(-30, -30, ROOM_W + 60, ROOM_H + 60);

    // Платформы статичные
    for (const p of lvl.platforms) {
      if (p.y + p.h >= 550) ctx.fillStyle = lvl.floor;
      else if (p.x === 0 || p.x + p.w === 1000 || p.y === 0) ctx.fillStyle = lvl.wall;
      else ctx.fillStyle = lvl.plat;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }

    // Кровавые пятна
    for (const b of bloodStains) {
      ctx.globalAlpha = b.alpha;
      ctx.fillStyle = '#8b0000';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Движущиеся платформы
    if (lvl.movingPlats) for (const mp of lvl.movingPlats) {
      const pos = getMovingPos(mp);
      ctx.fillStyle = lvl.plat;
      ctx.fillRect(pos.x, pos.y, pos.w, pos.h);
      ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2;
      ctx.strokeRect(pos.x, pos.y, pos.w, pos.h);
    }

    // Мигающие платформы
    if (lvl.vanishPlats) for (const vp of lvl.vanishPlats) {
      const active = isVanishActive(vp);
      if (!active) {
        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(vp.x, vp.y, vp.w, vp.h);
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        continue;
      }
      // Проверка близости исчезновения
      const t = getTime();
      const cycle = vp.onTime + vp.offTime;
      const phase = ((t + (vp.phase || 0)) % cycle + cycle) % cycle;
      const timeLeft = vp.onTime - phase;
      const blinking = timeLeft < 0.6 && Math.floor(timeLeft * 10) % 2 === 0;

      ctx.fillStyle = blinking ? '#facc15' : lvl.plat;
      ctx.fillRect(vp.x, vp.y, vp.w, vp.h);
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2;
      ctx.strokeRect(vp.x, vp.y, vp.w, vp.h);
    }

    // Лазеры
    if (lvl.lasers) for (const l of lvl.lasers) {
      const active = isLaserActive(l);
      if (active) {
        ctx.strokeStyle = 'rgba(255,50,50,0.95)';
        ctx.shadowColor = '#ff3333';
        ctx.shadowBlur = 20;
        ctx.lineWidth = l.w;
        ctx.beginPath();
        ctx.moveTo(l.x + l.w/2, l.y);
        ctx.lineTo(l.x + l.w/2, l.y + l.h);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(255,50,50,0.15)';
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(l.x + l.w/2, l.y);
        ctx.lineTo(l.x + l.w/2, l.y + l.h);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Шипы
    if (lvl.spikes) for (const s of lvl.spikes) {
      if (s.w <= 0) continue;
      ctx.fillStyle = '#cbd5e1';
      const numSpikes = Math.max(1, Math.floor(s.w / 10));
      const spikeWidth = s.w / numSpikes;
      for (let i = 0; i < numSpikes; i++) {
        const sx = s.x + i * spikeWidth;
        ctx.beginPath();
        ctx.moveTo(sx, s.y + s.h);
        ctx.lineTo(sx + spikeWidth / 2, s.y);
        ctx.lineTo(sx + spikeWidth, s.y + s.h);
        ctx.closePath();
        ctx.fill();
      }
      // База
      ctx.fillStyle = '#64748b';
      ctx.fillRect(s.x, s.y + s.h - 2, s.w, 3);
    }

    // Плиты
    if (lvl.plates) {
      lvl.plates.forEach(function(p, i) {
        const active = puzzle.plates[i];
        ctx.fillStyle = active ? '#4ade80' : '#7a5a2a';
        if (active) { ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 15; }
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = active ? '#22c55e' : '#a87a3a';
        ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
        if (puzzle.plateSequence && [2, 5, 10].indexOf(levelNum) >= 0) {
          const num = puzzle.plateSequence.indexOf(i) + 1;
          ctx.fillStyle = active ? '#166534' : '#ffaa44';
          ctx.font = 'bold 24px Courier New';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(num, p.x + p.w/2, p.y - 18);
        }
      });
    }

    // Синхро-рычаги
    if (lvl.syncLevers) {
      lvl.syncLevers.forEach(function(lever, i) {
        const active = puzzle.levers[i];
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(lever.x, lever.y + lever.h - 8, lever.w, 8);
        ctx.strokeStyle = active ? '#4ade80' : '#a87a3a';
        ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(lever.x + lever.w/2, lever.y + lever.h - 8);
        ctx.lineTo(lever.x + lever.w/2 - 12, lever.y + 5);
        ctx.stroke();
        ctx.fillStyle = active ? '#4ade80' : '#facc15';
        if (active) { ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 20; }
        ctx.beginPath(); ctx.arc(lever.x + lever.w/2 - 12, lever.y + 5, 6, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    // Дверь
    if (lvl.door) {
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(lvl.door.x - 4, lvl.door.y - 4, lvl.door.w + 8, lvl.door.h + 4);
      if (puzzle.doorOpen) {
        const g = ctx.createLinearGradient(0, lvl.door.y, 0, lvl.door.y + lvl.door.h);
        g.addColorStop(0, '#4ade80'); g.addColorStop(1, '#166534');
        ctx.fillStyle = g; ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 30;
        ctx.fillRect(lvl.door.x, lvl.door.y, lvl.door.w, lvl.door.h);
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#1a0f05';
        ctx.fillRect(lvl.door.x, lvl.door.y, lvl.door.w, lvl.door.h);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(lvl.door.x + lvl.door.w/2, lvl.door.y + lvl.door.h/2, 5, 0, Math.PI*2); ctx.fill();
      }
    }

    if (lvl.key && !puzzle.keyCollected) drawKey(lvl.key.x, lvl.key.y);
    if (lvl.lever && !puzzle.leverPulled) drawLever(lvl.lever.x, lvl.lever.y, lvl.lever.w, lvl.lever.h);
    if (lvl.torches) lvl.torches.forEach(function(t) { drawTorch(t.x, t.y); });

    // Частицы
    for (const p of particles) {
      ctx.globalAlpha = p.life * (p.ambient ? 0.7 : 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Мигание при неуязвимости
    const blink = performance.now() < invulnUntil && Math.floor(performance.now() / 100) % 2 === 0;

    if (other.online) drawPlayer(other.x, other.y, other.facing, other.walkPhase, other.color, false);
    if (!blink) drawPlayer(me.x, me.y, me.facing, me.walkPhase, myColor, true);
  }

  ctx.restore();

  // Виньетка
  const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height/3,
    canvas.width/2, canvas.height/2, canvas.height);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Красная вспышка смерти
  if (deathFlash > 0) {
    ctx.fillStyle = 'rgba(255,0,0,' + (deathFlash * 0.5) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Шёпот
  if (whisper) {
    ctx.globalAlpha = whisper.life * 0.7;
    ctx.fillStyle = '#aa8866';
    ctx.font = 'italic 20px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(whisper.text, 40, canvas.height - 60);
    ctx.globalAlpha = 1;
  }
}

function drawKey(x, y) {
  const bob = Math.sin(performance.now() / 300) * 4;
  ctx.save(); ctx.translate(x + 11, y + 11 + bob);
  ctx.shadowColor = '#facc15'; ctx.shadowBlur = 25;
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(-4, 0, 5, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#facc15';
  ctx.fillRect(0, -2, 14, 4); ctx.fillRect(12, 0, 3, 5); ctx.fillRect(7, 0, 3, 4);
  ctx.restore();
}
function drawLever(x, y, w, h) {
  ctx.save();
  ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x, y + h - 8, w, 8);
  ctx.strokeStyle = '#a87a3a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + w/2, y + h - 8); ctx.lineTo(x + w/2 - 12, y + 5); ctx.stroke();
  ctx.fillStyle = '#facc15'; ctx.shadowColor = '#facc15'; ctx.shadowBlur = 15;
  ctx.beginPath(); ctx.arc(x + w/2 - 12, y + 5, 6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawTorch(x, y) {
  const t = performance.now() / 100;
  const f = 0.85 + Math.sin(t + x) * 0.1 + Math.random() * 0.08;
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x - 3, y, 6, 20);
  const fh = 30 * f;
  const g = ctx.createRadialGradient(x, y - 10, 2, x, y - 10, fh);
  g.addColorStop(0, '#fff7aa'); g.addColorStop(0.4, '#ffaa44'); g.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 10, fh, 0, Math.PI*2); ctx.fill();
  const lg = ctx.createRadialGradient(x, y, 20, x, y, 130);
  lg.addColorStop(0, 'rgba(255,170,68,0.12)'); lg.addColorStop(1, 'rgba(255,170,68,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(x, y, 130, 0, Math.PI*2); ctx.fill();
}
function drawPlayer(x, y, facing, walkPhase, color, isMe) {
  ctx.save();
  ctx.translate(x + PLAYER_W/2, y + PLAYER_H);
  ctx.scale(facing, 1);
  const golden = isMe && performance.now() < goldenUntil;
  const bodyColor = golden ? '#ffd700' : color;
  const legSwing = Math.sin(walkPhase) * 3;
  ctx.fillStyle = shade(bodyColor, -40);
  ctx.fillRect(-7, -8, 5, 8 + legSwing);
  ctx.fillRect(2, -8, 5, 8 - legSwing);
  if (golden) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 25; }
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-PLAYER_W/2, -PLAYER_H + 5, PLAYER_W, PLAYER_H - 13);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = shade(bodyColor, -60); ctx.lineWidth = 2;
  ctx.strokeRect(-PLAYER_W/2, -PLAYER_H + 5, PLAYER_W, PLAYER_H - 13);
  ctx.fillStyle = '#f5deb3';
  ctx.beginPath(); ctx.arc(0, -PLAYER_H + 2, 8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#c9b185'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(3, -PLAYER_H + 1, 1.5, 0, Math.PI*2); ctx.fill();
  const ff = 0.85 + Math.random() * 0.15;
  ctx.fillStyle = '#5a3a1a'; ctx.fillRect(8, -PLAYER_H + 12, 3, 14);
  const fx = 9.5, fy = -PLAYER_H + 8, fr = 8 * ff;
  const fg = ctx.createRadialGradient(fx, fy, 1, fx, fy, fr);
  fg.addColorStop(0, '#fff7aa'); fg.addColorStop(0.5, '#ffaa44'); fg.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.fill();
  if (isMe) {
    ctx.scale(1/facing, 1);
    ctx.fillStyle = golden ? '#ffd700' : '#ffaa44';
    ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(golden ? '★ ВЫ ★' : 'ВЫ', 0, -PLAYER_H - 15);
  }
  ctx.restore();
}
function shade(hex, p) {
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + p));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 0xFF) + p));
  const b = Math.max(0, Math.min(255, (n & 0xFF) + p));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// ==================== ЦИКЛ ====================
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameRunning) {
    updatePhysics(dt);
    sendState(dt);
    interpOther();
  }
  updateParticles(dt);

  if (deathFlash > 0) deathFlash = Math.max(0, deathFlash - dt * 2.5);
  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 60);

  whisperTimer -= dt;
  if (whisper) {
    whisper.life -= dt * 0.25;
    if (whisper.life <= 0) { whisper = null; whisperTimer = 15 + Math.random() * 20; }
  } else if (whisperTimer <= 0 && gameRunning) {
    whisper = { text: WHISPERS[Math.floor(Math.random() * WHISPERS.length)], life: 1 };
  }

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== UI ====================
function startGame(level) {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  gameRunning = true;
  otherInitialized = false;
  deathsCount = 0;
  document.getElementById('hud-deaths').textContent = 0;
  loadLevel(level);
}
function showScreen(name) {
  ['main','join','wait','win'].forEach(function(s) {
    const el = document.getElementById('menu-' + s);
    if (!el) return;
    if (s === name) { el.classList.remove('hidden'); el.style.display = 'flex'; }
    else { el.classList.add('hidden'); el.style.display = 'none'; }
  });
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  gameRunning = false;
}

const colorsEl = document.getElementById('colors');
COLORS.forEach(function(c, i) {
  const b = document.createElement('div');
  b.className = 'color-btn' + (i === 0 ? ' active' : '');
  b.style.background = c; b.style.color = c;
  b.onclick = function() {
    myColor = c;
    document.querySelectorAll('.color-btn').forEach(function(x) { x.classList.remove('active'); });
    b.classList.add('active');
  };
  colorsEl.appendChild(b);
});

document.getElementById('btn-create').onclick = function() {
  ensureConnected(function() { ws.send(JSON.stringify({ type:'create', color: myColor })); });
};
document.getElementById('btn-join').onclick = function() {
  showScreen('join');
  setTimeout(function() { document.getElementById('join-input').focus(); }, 100);
};
document.getElementById('btn-back').onclick = function() { showScreen('main'); };
document.getElementById('btn-join-go').onclick = function() {
  const code = document.getElementById('join-input').value.trim().toUpperCase();
  if (code.length !== 4) { alert('Введите 4-значный код'); return; }
  ensureConnected(function() { ws.send(JSON.stringify({ type:'join', code: code, color: myColor })); });
};
document.getElementById('join-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('btn-join-go').click();
});
document.getElementById('btn-cancel').onclick = function() {
  if (ws) { ws.close(); ws = null; }
  showScreen('main');
};
document.getElementById('btn-restart').onclick = function() { location.reload(); };

showScreen('main');
</script>
